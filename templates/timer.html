<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer | AI Study Planner</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .timer-box {
            text-align: center;
            padding: 35px;
        }

        #display {
            font-size: 64px;
            font-weight: bold;
            color: #6c4cff;
            margin: 25px 0;
        }

        .timer-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .timer-buttons button {
            min-width: 100px;
        }

        .secondary {
            background: #64748b;
        }
    </style>
</head>

<body>

<header class="topbar">
    <a class="brand" href="/dashboard">
        ✦ AI Study Planner
    </a>

    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/subjects">Subjects</a>
        <a href="/tasks">Tasks</a>
        <a href="/schedule">Schedule</a>
        <a href="/recommendations">AI Coach</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<div class="page">

    <a class="back" href="/dashboard">
        ← Back to Dashboard
    </a>

    <h1>⏱️ Study Timer</h1>

    <p>
        Choose a task and start your focused study session.
    </p>

    <div class="card timer-box">

        {% if tasks %}

        <label for="task">
            Select Task
        </label>

        <select id="task">
            {% for task in tasks %}
                {% if task["completed"] == 0 %}
                <option value="{{ task['id'] }}">
                    {{ task["subject_name"] }} — {{ task["task_name"] }}
                </option>
                {% endif %}
            {% endfor %}
        </select>

        <div id="display">00:00:00</div>

        <div class="timer-buttons">

            <button onclick="startTimer()">
                ▶ Start
            </button>

            <button class="secondary" onclick="pauseTimer()">
                ⏸ Pause
            </button>

            <button class="secondary" onclick="resetTimer()">
                ↺ Reset
            </button>

            <button onclick="saveSession()">
                💾 Save Session
            </button>

        </div>

        <p id="message"></p>

        {% else %}

        <h2>📭 No pending tasks</h2>

        <p>
            Add a study task before starting the timer.
        </p>

        <a class="button" href="/tasks">
            Add Study Task
        </a>

        {% endif %}

    </div>

</div>

<script>
let seconds = 0;
let timer = null;

function updateDisplay() {

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    document.getElementById("display").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");
}

function startTimer() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {
        seconds++;
        updateDisplay();
    }, 1000);
}

function pauseTimer() {

    clearInterval(timer);
    timer = null;
}

function resetTimer() {

    pauseTimer();

    seconds = 0;
    updateDisplay();

    document.getElementById("message").textContent = "";
}

function saveSession() {

    pauseTimer();

    const task = document.getElementById("task");

    if (!task || !task.value) {
        return;
    }

    const minutes = Math.floor(seconds / 60);

    if (minutes < 1) {
        document.getElementById("message").textContent =
            "Study for at least 1 minute before saving.";
        return;
    }

    const form = document.createElement("form");

    form.method = "POST";
    form.action = "/save_session";

    form.innerHTML =
        '<input name="task_id" value="' + task.value + '">' +
        '<input name="duration" value="' + minutes + '">';

    document.body.appendChild(form);

    form.submit();
}
</script>

</body>
</html>
